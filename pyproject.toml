[project]
name = "authors-db"
version = "0.1.0"
description = "Base de datos enriquecida de autores via resolución de entidades (Wikidata + Open Library)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "unidecode>=1.3",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authors_db"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
